name: brickbot

x-backend-tool: &backend-tool
  profiles: [tools]
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  env_file: .env
  volumes:
    - ./backend:/src
  working_dir: /src
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: .env
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./backend:/app
      - gomod:/go/pkg/mod
      - gocache:/go-cache
      - uploads:/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s   # first boot downloads modules and compiles

  frontend:
    image: node:22.23.3-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      npm_config_cache: /tmp/.npm
      API_PROXY_TARGET: http://api:8080
    volumes:
      - ./frontend:/app   # node_modules lives in the bind mount (gitignored), owned by host UID
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s   # npm ci on first boot

  # ---- tool containers: `docker compose run --rm <name> ...` (see Makefile) ----
  atlas:
    <<: *backend-tool
    image: arigaio/atlas:1.3.3-community

  sqlc:
    <<: *backend-tool
    image: sqlc/sqlc:1.31.1
    depends_on: []

  golangci-lint:
    <<: *backend-tool
    image: golangci/golangci-lint:v2.14.0-alpine
    depends_on: []
    environment:
      GOCACHE: /tmp/go-cache
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint
    volumes:
      - ./backend:/src
      - gomod:/go/pkg/mod

volumes:
  pgdata:
  gomod:
  gocache:
  uploads:
